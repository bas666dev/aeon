version: "3.9"
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/neo4jpass"
    ports:
      - "7474:7474"
      - "7687:7687"
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/aeon
      MONGO_DB: aeon
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: neo4jpass
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - neo4j
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/aeon
      MONGO_DB: aeon
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: neo4jpass
    depends_on:
      - mongo
      - neo4j
